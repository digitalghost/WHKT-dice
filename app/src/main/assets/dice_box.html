<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent;
        }
        #dice-box {
            position: relative;
            width: 100%; height: 100%;
        }
        #dice-box canvas {
            width: 100% !important;
            height: 100% !important;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #C89B3C;
            font-family: sans-serif;
            font-size: 13px;
            letter-spacing: 0.15em;
            text-align: center;
        }
        #loading .spinner {
            width: 26px; height: 26px;
            border: 2px solid #332A10;
            border-top-color: #C89B3C;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="dice-box"></div>
    <div id="loading">
        <div class="spinner"></div>
        SUMMONING DICE
    </div>
    <script type="module">
        import DiceBox from "./dice-box/dice-box.es.min.js";

        let box = null;
        let isReady = false;

        function initBox() {
            box = new DiceBox({
                container: "#dice-box",
                assetPath: "assets/",
                origin: "https://appassets.androidplatform.com/assets/dice-box/",
            scale: 4.5,
                theme: "default",
        themeColor: "#D8CBA8",
                gravity: 2.5,
                throwForce: 4,
                spinForce: 3,
                lightIntensity: 0.8,
                enableShadows: false,
                settleTimeout: 2500,
            });

            box.init().then(function() {
                isReady = true;
                document.getElementById('loading').style.display = 'none';
                if (window.AndroidInterface) {
                    window.AndroidInterface.onReady();
                }
            }).catch(function(err) {
                document.getElementById('loading').innerHTML =
                    'FAILED TO SUMMON';
                console.error('DiceBox init error:', err);
            });

            box.onRollComplete = function(results) {
                if (window.AndroidInterface) {
                    const values = [];
                    for (const group of results) {
                        if (group.rolls) {
                            for (const roll of group.rolls) {
                                values.push(roll.value);
                            }
                        }
                    }
                    window.AndroidInterface.onRollComplete(JSON.stringify(values));
                }
            };
        }

        window.doRoll = function(notation) {
            if (!isReady || !box) return;
            box.clear();
            setTimeout(function() {
                box.roll(notation);
            }, 30);
        };

        window.clearDice = function() {
            if (box) box.clear();
        };

        initBox();
    </script>
</body>
</html>
